name: lint

# Shellcheck the CLI + template hooks. GitHub-hosted ubuntu runners ship
# shellcheck, so bin/lint uses it directly (no docker fallback needed here).
on:
  push:
    branches: [main]
  pull_request:

# Read-only: this job only checks out and runs shellcheck.
permissions:
  contents: read

# A new push to a PR makes the in-flight run moot.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version
      - run: bin/lint
