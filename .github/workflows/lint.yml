name: lint

# Shellcheck the CLI + template hooks. GitHub-hosted ubuntu runners ship
# shellcheck, so bin/lint uses it directly (no docker fallback needed here).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version
      - run: bin/lint
