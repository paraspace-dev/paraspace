name: publish

# Publish to npm when a v* tag is pushed: `npm version <bump> && git push --follow-tags`.
#
# Authentication is npm trusted publishing (OIDC) — no NPM_TOKEN, nothing
# long-lived to leak. It needs a trusted publisher registered for the package
# on npmjs.com naming this repo and this file; see README's Development section.
on:
  push:
    tags: ['v*']

# id-token mints the OIDC token npm authenticates with. contents stays read:
# publishing writes nothing back to the repo.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 24 for npm >= 11.5.1, which trusted publishing requires.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The tag names the release; package.json is what npm actually publishes.
      # A mismatch ships the wrong version under the right name.
      - name: tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      # Run explicitly so a failure names which gate broke; package.json's
      # prepublishOnly runs them again under `npm publish` so a manual publish
      # from a laptop can't skip them.
      - run: bin/lint
      - run: test/run --cli

      # Trusted publishing generates the provenance attestation itself, so no
      # --provenance flag. --access public is only meaningful on the first
      # publish, and is a no-op after.
      - run: npm publish --access public
