name: test

# The CLI tier of the para suite (test/run --cli): argument handling, help text,
# `para init`, and the plugin the package ships. It needs only bash, node and
# the checkout, with no incus, and GitHub-hosted ubuntu-latest already has bash
# and node, so nothing installs here and there is no setup-node step. The e2e
# tier (test/run --e2e) drives real Incus workspaces and is run locally / on a
# self-hosted incus runner, not here.
on:
  push:
    branches: [main]
  pull_request:

# Read-only: this job checks out the repo and runs the suite, writing nothing.
permissions:
  contents: read

# A new push to a PR makes the in-flight run moot.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test/run --cli
