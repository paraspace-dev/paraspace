name: test

# The CLI tier of the para suite (test/run --cli): argument handling, help text,
# and `para init`. It needs only bash + the checkout — no incus — so it runs on
# GitHub-hosted runners. The e2e tier (test/run --e2e) drives real Incus
# workspaces and is run locally / on a self-hosted incus runner, not here.
on:
  push:
    branches: [main]
  pull_request:

# Read-only: this job only checks out and runs bash.
permissions:
  contents: read

# A new push to a PR makes the in-flight run moot.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test/run --cli
