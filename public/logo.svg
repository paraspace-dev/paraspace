<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 81 50">
  <!-- The poster's two lenses, flattened. r=25 with centres 31 apart puts the
       overlap at 0.38 of a diameter, which is Mastercard's ratio rather than
       the poster's wider 0.72 split. At tab size a thinner overlap stops
       reading as a shared region and starts looking like two circles that
       merely touch. The hues are halfway between the two themes' lenses and the
       overlap is those two multiplied, so one file reads on the dark sheet and
       on the paper. -->
  <title>ParaSpace</title>
  <circle cx="25" cy="25" r="25" fill="#4a91ae"/>
  <circle cx="56" cy="25" r="25" fill="#6ea969"/>
  <path d="M40.5 5.385A25 25 0 0 1 40.5 44.615A25 25 0 0 1 40.5 5.385Z" fill="#206048"/>
</svg>
