# para shared tmux config — seeded once from .paraspace/skel/, shared across every
# workspace via ~/.config/tmux -> /para/shared/tmux. tmux >= 3.1 reads this path.

# Truecolor. `default-terminal` is what apps INSIDE tmux see; `terminal-features
# ,*:RGB` advertises 24-bit color for whatever outer terminal is attached — the
# old `*256col*:Tc` override missed terminals like alacritty/ghostty (TERM has
# no "256col"), and their terminfo often doesn't declare RGB, so truecolor got
# downgraded to 256-color approximations that look wrong vs the native terminal.
set -g  default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Ctrl-a leader (screen-style) — easier reach than Ctrl-b.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Mouse on, 1-based indexing, big scrollback.
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 100000

# Faster escape (matters when driving vim/claude inside).
set -sg escape-time 10

# Forward terminal focus in/out to apps inside tmux. Claude Code and vim watch
# for focus events (to refresh, autosave, drop stale state); without this tmux
# swallows the escape sequences and they never see focus changes.
set -g focus-events on

# Intuitive splits that keep the current path.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Status bar shows the hostname (para-<workspace>) so you always know where you are.
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[bg=colour30,fg=colour231] #h #[default] "
set -g status-left-length 30
set -g status-right "%H:%M "

# `para run` names windows "claude" / "sh" (the workspace already shows in
# status-left via #h). Keep those names: don't auto-rename to the running
# command, and ignore rename escapes from the app (claude/vim set the title).
# The outer terminal's title bar shows "<session> · <window>" (e.g. "ws1 · sh")
# so the tab still identifies the workspace even outside tmux.
setw -g automatic-rename off
set  -g allow-rename off
set  -g set-titles on
set  -g set-titles-string "#S · #W"

# Window (tab) styling. tmux's default window-status-current-format embeds
# #{window_flags} (#F), which renders the "*" next to the active tab. Override
# both formats to drop the flag and mark the active tab with a filled gruvbox
# highlight instead — cleaner than the asterisk.
set -g window-status-format         " #W "
set -g window-status-current-format "#[fg=#d5c4a1,bg=#665c54] #W "
set -g window-status-current-style  bg=default,fg=default
set -g window-status-activity-style bg=default,fg=default
